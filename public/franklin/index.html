<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Franklin by Numbers</title>
    <meta name="description" content="A colour-by-numbers game starring Franklin the dog. Pick a picture, pick a colour, tap the matching numbers.">
    <meta name="theme-color" content="#fbf1df">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23d9822b'/%3E%3Cg fill='%23fff'%3E%3Cellipse cx='24' cy='31' rx='10' ry='8'/%3E%3Cellipse cx='11' cy='21' rx='4' ry='5.2'/%3E%3Cellipse cx='37' cy='21' rx='4' ry='5.2'/%3E%3Cellipse cx='18.5' cy='12.5' rx='4' ry='5.2'/%3E%3Cellipse cx='29.5' cy='12.5' rx='4' ry='5.2'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-paw" viewBox="0 0 48 48"><ellipse cx="24" cy="31" rx="11" ry="9"/><ellipse cx="9.5" cy="20" rx="4.6" ry="6"/><ellipse cx="38.5" cy="20" rx="4.6" ry="6"/><ellipse cx="18" cy="10.5" rx="4.6" ry="6"/><ellipse cx="30" cy="10.5" rx="4.6" ry="6"/></symbol>
            <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="i-hint" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.300 1.100 2.200h5c0-.9.4-1.600 1.100-2.200A6 6 0 0 0 12 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4Z" fill="currentColor"/><path d="M15.500 8.800a4.500 4.500 0 0 1 0 6.400M18 6.300a8 8 0 0 1 0 11.400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
            <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4Z" fill="currentColor"/><path d="m15.500 9.500 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
            <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.600-5.900M4 4v4.500h4.500" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.500 4.500L19 7.500" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"/></symbol>
            <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"/></symbol>
        </defs>
    </svg>

    <!-- Gallery: pick a picture -->
    <section id="gallery" class="screen gallery">
        <header class="g-head">
            <a class="back-link" href="/" target="_top"><svg><use href="#i-back"/></svg>Portfolio</a>
            <div class="brand">
                <span class="brand-paw"><svg><use href="#i-paw"/></svg></span>
                <div>
                    <h1>Franklin by Numbers</h1>
                    <p>Pick a picture, pick a colour, tap the matching numbers.</p>
                </div>
            </div>
        </header>
        <div id="cards" class="cards" aria-live="polite"><p class="loading">Fetching Franklin…</p></div>
        <footer class="g-foot">Starring Franklin, a very good boy. Your colouring is saved on this device.</footer>
    </section>

    <!-- Play: one picture -->
    <section id="play" class="screen play" hidden>
        <header class="bar">
            <button class="pill" id="btn-back" type="button"><svg><use href="#i-back"/></svg><span>Pictures</span></button>
            <div class="bar-title"><b id="p-title"></b><span id="p-pct">0%</span></div>
            <button class="icon" id="btn-hint" type="button" title="Show me one (H)" aria-label="Hint: show me an area to colour"><svg><use href="#i-hint"/></svg></button>
            <button class="icon" id="btn-fit" type="button" title="Fit the picture (0)" aria-label="Fit the picture on screen"><svg><use href="#i-fit"/></svg></button>
            <button class="icon" id="btn-sound" type="button" title="Sound" aria-label="Sound on or off"><svg><use id="sound-use" href="#i-sound"/></svg></button>
            <button class="icon" id="btn-restart" type="button" title="Start this picture again" aria-label="Start this picture again"><svg><use href="#i-restart"/></svg></button>
        </header>
        <div class="prog"><i id="prog-fill"></i></div>
        <div id="stage" class="stage">
            <canvas id="cv" aria-label="The picture to colour"></canvas>
            <div id="bubble" class="bubble" hidden></div>
            <div class="zoom">
                <button class="icon" id="z-in" type="button" aria-label="Zoom in"><svg><use href="#i-plus"/></svg></button>
                <button class="icon" id="z-out" type="button" aria-label="Zoom out"><svg><use href="#i-minus"/></svg></button>
            </div>
            <div id="confirm" class="confirm" hidden>
                <p>Start <b id="confirm-title"></b> again? Your colouring on this picture will be cleared.</p>
                <div><button class="btn" id="confirm-no" type="button">Keep it</button><button class="btn warn" id="confirm-yes" type="button">Start again</button></div>
            </div>
        </div>
        <nav id="palette" class="palette" aria-label="Colours"></nav>
        <div id="done" class="done" hidden>
            <div class="done-text"><b id="done-title">All done!</b><span id="done-sub">Franklin approves.</span></div>
            <div class="done-btns">
                <button class="btn" id="btn-photo" type="button" aria-pressed="false">See the real Franklin</button>
                <button class="btn" id="btn-save" type="button">Save picture</button>
                <button class="btn primary" id="btn-next" type="button">Next picture</button>
            </div>
        </div>
    </section>

    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
    <script src="js/game.js?v=1"></script>
</body>
</html>
